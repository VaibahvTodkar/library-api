# ============================================================
# Application
# ============================================================

spring.application.name=library-api
server.port=8080


# ============================================================
# PostgreSQL Database
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/school_library?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# HikariCP Connection Pool
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LibraryHikariPool


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# Hibernate Logging
# ============================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ============================================================
# Spring Web Logging
# ============================================================

logging.level.org.springframework.web=INFO


# ============================================================
# Application Logging
# ============================================================

logging.level.com.authsystem=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ADD THESE:
logging.file.name=logs/library-api.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/library-api-%d{yyyy-MM-dd}.%i.log


# ============================================================
# JWT CONFIGURATION
# ============================================================

app.jwt.issuer=https://library.school.example
app.jwt.audience=library-api

# 15 minutes
app.jwt.access-token-ttl=PT15M

# 60 seconds clock tolerance
app.jwt.clock-skew=PT60S

app.jwt.private-key=file:config/keys/jwt-private.pem
app.jwt.public-key=file:config/keys/jwt-public.pem

# Current signing key identifier
app.jwt.key-id=2026-09-key-01

# Algorithm
app.jwt.algorithm=RS256

# JWT claims
app.jwt.role-claim=role
app.jwt.permissions-claim=permissions
app.jwt.user-id-claim=uid
app.jwt.token-version-claim=token_version

#JWT refresh token configuratio
app.jwt.refresh-token-ttl-days=7
app.jwt.refresh-token-remember-me-ttl-days=30


# CORS Configuration
app.cors.allowed-origins=http://localhost:4200
	
# SWagger COnfiguration 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


